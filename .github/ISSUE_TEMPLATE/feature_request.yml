name: Feature request
description: Suggest a tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you want your assistant to handle, in plain words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: New tool, parameter or behaviour. Note any new Google scopes it would need.
