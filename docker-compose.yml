# Local or single-host deployment: the server plus Postgres.
#   cp .env.example .env   # fill in values; DATABASE_URL/DATABASE_SSL below override .env
#   docker compose up -d
# Claude needs a public HTTPS URL; put a reverse proxy or tunnel in front and set BASE_URL to it.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://mcp:mcp@db:5432/mcp
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp
      POSTGRES_DB: mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
